openapi: 3.0.3
info:
  title: SmartSpace API
  version: 1.0.0-draft
  description: |
    Contract voor SmartSpace release 1. Local date-time choices are represented by
    offset-aware RFC 3339 values; clients use stable problem codes for recovery actions.
servers:
  - url: http://localhost:5080
    description: Development API
security:
  - developmentIdentity: []
tags:
  - name: Locations
  - name: Rooms
  - name: Reservations
  - name: Administration
paths:
  /api/locations:
    get:
      tags: [Locations]
      summary: List active locations
      responses:
        '200':
          description: Active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
  /api/rooms:
    get:
      tags: [Rooms]
      summary: List rooms
      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: '#/components/parameters/MinCapacity'
      responses:
        '200':
          description: Active room catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
  /api/rooms/availability:
    get:
      tags: [Rooms]
      summary: Find rooms available for an exact interval
      parameters:
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/LocationId'
        - $ref: '#/components/parameters/MinCapacity'
      responses:
        '200':
          description: Matching rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/rooms/{id}:
    get:
      tags: [Rooms]
      summary: Get room details
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/reservations/mine:
    get:
      tags: [Reservations]
      summary: List the current user's reservations
      parameters:
        - name: view
          in: query
          schema:
            type: string
            enum: [upcoming, past, cancelled]
            default: upcoming
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Own reservations only
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/reservations/{id}:
    get:
      tags: [Reservations]
      summary: Get an accessible own reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Own reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Reservations]
      summary: Update an own future active reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReservationRequest'
      responses:
        '200':
          description: Updated reservation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/reservations:
    post:
      tags: [Reservations]
      summary: Create an own reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Created reservation
          headers:
            Location:
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/reservations/{id}/cancel:
    post:
      tags: [Reservations]
      summary: Cancel an own future active reservation
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelReservationRequest'
      responses:
        '200':
          description: Reservation cancelled by the first cancellation
          '204':
            description: Reservation was cancelled
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms:
    post:
      tags: [Administration]
      summary: Create a room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
      responses:
        '201':
          description: Created room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/locations:
    get:
      tags: [Administration]
      summary: List locations for administration and room selection
      responses:
        '200':
          description: All locations visible to administrators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminLocation' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Administration]
      summary: Create a location
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreateRequest' }
      responses:
        '200':
          description: Created location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/locations/{id}:
    put:
      tags: [Administration]
      summary: Update a location
      parameters:
        - $ref: '#/components/parameters/LocationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdateRequest' }
      responses:
        '200':
          description: Updated location
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms/{id}:
    put:
      tags: [Administration]
      summary: Update room configuration
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomWriteRequest'
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms/{id}/deactivate:
    post:
      tags: [Administration]
      summary: Deactivate a room without active current/future bookings
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Deactivated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/rooms/{id}/reactivate:
    post:
      tags: [Administration]
      summary: Reactivate a room on an active location
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionRequest'
      responses:
        '200':
          description: Reactivated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    developmentIdentity:
      type: http
      scheme: bearer
      bearerFormat: development-only
  parameters:
    LocationId:
      name: locationId
      in: query
      required: false
      schema: { type: string, format: uuid }
    MinCapacity:
    AdminLocation:
      type: object
      required: [id, name, isActive, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        building: { type: string, nullable: true }
        floor: { type: string, nullable: true }
        isActive: { type: boolean }
        version: { type: string, format: uuid }
    LocationCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        building: { type: string, nullable: true }
        floor: { type: string, nullable: true }
    LocationUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/LocationCreateRequest'
        - $ref: '#/components/schemas/VersionRequest'
      name: minCapacity
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
    Start:
      name: start
      in: query
      required: true
      description: Offset-aware RFC 3339 instant selected by the user in Europe/Amsterdam.
      schema: { type: string, format: date-time, example: '2026-10-25T02:30:00+02:00' }
    End:
      name: end
      in: query
      required: true
      description: Offset-aware RFC 3339 instant selected by the user in Europe/Amsterdam.
      schema: { type: string, format: date-time, example: '2026-10-25T03:30:00+01:00' }
    RoomId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
            resourceId: { type: string, format: uuid }
            resourceName: { type: string }
      required: true
            locationId: { type: string, format: uuid }
            capacity: { type: integer, minimum: 1 }
      schema: { type: string, format: uuid }
  schemas:
            status: { type: integer, enum: [1, 2], description: 1=Active, 2=Cancelled }
      type: object
      required: [id, name]
      properties:
          properties:
            resourceId: { type: string, format: uuid }
        building: { type: string, nullable: true }
        floor: { type: string, nullable: true }
    Room:
      type: object
      required: [id, name, capacity, locationId, isActive, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer, minimum: 1 }
        locationId: { type: string, format: uuid }
        locationName: { type: string }
        isActive: { type: boolean }
        version: { type: string, format: uuid }
    Reservation:
      type: object
      required: [id, resourceId, resourceName, locationName, locationId, capacity, start, end, status, version]
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string, format: uuid }
        roomName: { type: string }
        locationName: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { type: string, enum: [Active, Cancelled] }
        version: { type: string, format: uuid }
    CreateReservationRequest:
      type: object
      required: [resourceId, start, end]
      properties:
        roomId: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    UpdateReservationRequest:
      allOf:
        - $ref: '#/components/schemas/CreateReservationRequest'
        - $ref: '#/components/schemas/VersionRequest'
    CancelReservationRequest:
      $ref: '#/components/schemas/VersionRequest'
    RoomWriteRequest:
      type: object
      required: [name, capacity, locationId, version]
      properties:
        name: { type: string }
        capacity: { type: integer, minimum: 1 }
        locationId: { type: string, format: uuid }
        version: { type: string, format: uuid }
    RoomCreateRequest:
      type: object
      required: [name, capacity, locationId]
      properties:
        name: { type: string }
        capacity: { type: integer, minimum: 1 }
        locationId: { type: string, format: uuid }
    VersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, format: uuid }
    ProblemDetails:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [validation_error, booking_overlap, stale_version, forbidden, temporary_persistence_error]
          example: booking_overlap
        traceId: { type: string }
  responses:
    BadRequest:
      description: Invalid input or local time
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Not found or not accessible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Overlap, stale version or lifecycle policy conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
