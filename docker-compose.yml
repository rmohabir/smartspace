services:
  sqlserver:
    # Startpunt-tag; local team digest is documented in docs/decisions/ADR-002-sql-server-persistence.md.
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SMARTSPACE_SQL_PASSWORD:?Set password in .env}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - smartspace-sql:/var/opt/mssql

volumes:
  smartspace-sql:
