services:
  sqlserver:
    # Startpunt-tag; local team digest is documented in docs/decisions/ADR-002-sql-server-persistence.md.
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SMARTSPACE_SQL_PASSWORD:?Set password in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - smartspace-sql:/var/opt/mssql

volumes:
  smartspace-sql:
